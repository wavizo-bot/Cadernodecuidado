apply plugin: 'com.android.application'

/* Versão e código vêm de fora do Gradle para não divergirem do app web:
   - package.json (version)  -> versionName e carimbo do rodapé
   - version-code.txt        -> versionCode (SEMPRE maior no próximo envio) */
def capRoot = rootProject.file("..")
def capPkg = new groovy.json.JsonSlurper().parseText(new File(capRoot, "package.json").text)
def versionCodeFile = new File(capRoot, "version-code.txt")
if (!versionCodeFile.exists()) throw new GradleException("android/version-code.txt ausente")
def appVersionCode = versionCodeFile.text.trim().toInteger()
def appVersionName = capPkg.version.toString()

/* A chave de upload fica fora do git (regra 3.1). O arquivo é local:
   android/android/keystore.properties -> aponta para keystore/caderno-upload.keystore */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) keystoreProps.load(new FileInputStream(keystorePropsFile))

android {
    namespace "caderno.decuidado.app"
    compileSdk rootProject.ext.compileSdkVersion

    compileOptions {
        // Mensagens em português nos plugins; sem isso o javac usa cp1252 no
        // Windows e os acentos viram mojibake dentro do APK.
        encoding "UTF-8"
    }

    defaultConfig {
        applicationId "caderno.decuidado.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            // Regra A1: R8 e redução de recursos SEMPRE no release.
            minifyEnabled true
            shrinkResources true
            if (hasKeystore) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Mesma assinatura do release: instala por cima sem desinstalar e
            // mantém o mesmo applicationId usado por qualquer credencial futura.
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    doFirst {
        def cfg = file("src/main/assets/google-client.json")
        if (!cfg.exists()) {
            throw new GradleException("google-client.json ausente em src/main/assets. " +
                    "Copie de C:\\APPS\\ID.OAuth (regra 3.1) antes de gerar o AAB.")
        }
        if (!hasKeystore) {
            throw new GradleException("android/android/keystore.properties ausente: " +
                    "não é possível assinar o release.")
        }
    }
}
